<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="meeting-wingman: the live transcript on the left, Claude's suggested answer on the right">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "DejaVu Sans", sans-serif; }
    .label { font-size: 12px; letter-spacing: 1.5px; fill: #8b949e; font-weight: 600; }
    .ts { fill: #7ee787; font-size: 14px; }
    .tx { fill: #c9d1d9; font-size: 14px; }
    .dim { fill: #6e7681; font-size: 14px; }
    .b { fill: #e6edf3; font-size: 15px; }
    .h { fill: #f0f6fc; font-size: 17px; font-weight: 700; }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="959" height="499" rx="14" fill="#0d1117" stroke="#30363d"/>
  <circle cx="26" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="24" r="6" fill="#febc2e"/>
  <circle cx="66" cy="24" r="6" fill="#28c840"/>
  <text x="480" y="29" text-anchor="middle" class="sans" font-size="13" fill="#8b949e">claude — project review call</text>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#21262d"/>

  <!-- left: transcript -->
  <text x="28" y="82" class="sans label">LIVE TRANSCRIPT</text>
  <g class="mono">
    <text x="28" y="118"><tspan class="ts">[14:02:11]</tspan><tspan x="124" class="dim">Thanks, that was a clear</tspan></text>
    <text x="124" y="140" class="dim">overview of the pilot.</text>

    <text x="28" y="176"><tspan class="ts">[14:02:33]</tspan><tspan x="124" class="tx">One thing I'm missing:</tspan></text>
    <text x="124" y="198" class="tx">what happens to the data</text>
    <text x="124" y="220" class="tx">when a site loses its</text>
    <text x="124" y="242" class="tx">connection?</text>

    <text x="28" y="278"><tspan class="ts">[14:02:55]</tspan><tspan x="124" class="tx">And realistically, how</tspan></text>
    <text x="124" y="300" class="tx">long until this pays</text>
    <text x="124" y="322" class="tx">for itself?</text>

    <text x="28" y="358"><tspan class="ts">[14:03:17]</tspan><tspan x="124" fill="#58a6ff">▍</tspan></text>
  </g>

  <line x1="420" y1="68" x2="420" y2="440" stroke="#21262d"/>

  <!-- right: suggestion -->
  <text x="448" y="82" class="sans label">CLAUDE · SUGGESTED ANSWER</text>
  <rect x="448" y="98" width="484" height="300" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="448" y="98" width="4" height="300" rx="2" fill="#f0883e"/>

  <circle cx="480" cy="130" r="12" fill="#f0883e"/>
  <text x="480" y="135.5" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#0d1117">?</text>
  <text x="502" y="136" class="sans h">Offline data + payback time</text>

  <g class="sans">
    <circle cx="474" cy="172" r="3" fill="#8b949e"/>
    <text x="488" y="177" class="b">The gateway buffers 7 days locally and syncs</text>
    <text x="488" y="199" class="b">when the link is back. Nothing is lost.</text>

    <circle cx="474" cy="230" r="3" fill="#8b949e"/>
    <text x="488" y="235" class="b">Longest outage in the pilot: 31 hours, no gaps.</text>

    <circle cx="474" cy="266" r="3" fill="#8b949e"/>
    <text x="488" y="271" class="b">Payback is about 14 months at 40 devices,</text>
    <text x="488" y="293" class="b">according to the pilot customer's own estimate.</text>

    <line x1="472" y1="320" x2="908" y2="320" stroke="#30363d"/>
    <text x="472" y="352" font-size="15"><tspan fill="#ff7b72" font-weight="700">Don't say:</tspan><tspan dx="6" fill="#e6edf3">“It never goes offline.”</tspan></text>
    <text x="472" y="378" font-size="13" fill="#8b949e">Prep notes Q7 · 22 s after the question</text>
  </g>

  <!-- footer -->
  <line x1="0" y1="452" x2="960" y2="452" stroke="#21262d"/>
  <text x="28" y="481" class="sans" font-size="13" fill="#8b949e">Listens to what your computer plays  ·  transcribes on your machine or your GPU box  ·  nothing joins the call</text>
</svg>
