<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Team mode: the live transcript of a standup on the left; on the right, a proposed new task with owner and due date, and a comment added to an existing task">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "DejaVu Sans", sans-serif; }
    .label { font-size: 12px; letter-spacing: 1.5px; fill: #8b949e; font-weight: 600; }
    .ts { fill: #7ee787; font-size: 14px; }
    .tx { fill: #c9d1d9; font-size: 14px; }
    .dim { fill: #6e7681; font-size: 14px; }
    .b { fill: #e6edf3; font-size: 15px; }
    .m { fill: #8b949e; font-size: 13px; }
    .h { fill: #f0f6fc; font-size: 16px; font-weight: 700; }
  </style>

  <rect x="0.5" y="0.5" width="959" height="499" rx="14" fill="#0d1117" stroke="#30363d"/>
  <circle cx="26" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="24" r="6" fill="#febc2e"/>
  <circle cx="66" cy="24" r="6" fill="#28c840"/>
  <text x="480" y="29" text-anchor="middle" class="sans" font-size="13" fill="#8b949e">claude — weekly team sync</text>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#21262d"/>

  <text x="28" y="82" class="sans label">LIVE TRANSCRIPT</text>
  <g class="mono">
    <text x="28" y="118"><tspan class="ts">[10:14:02]</tspan><tspan x="124" class="dim">OK, next one is the</tspan></text>
    <text x="124" y="140" class="dim">billing export.</text>

    <text x="28" y="176"><tspan class="ts">[10:14:24]</tspan><tspan x="124" class="tx">Maria, can you get the</tspan></text>
    <text x="124" y="198" class="tx">CSV fix out before the</text>
    <text x="124" y="220" class="tx">Thursday release?</text>
    <text x="28" y="248"><tspan class="ts">[10:14:46]</tspan><tspan x="124" class="tx">Sure, Thursday works.</tspan></text>

    <text x="28" y="284"><tspan class="ts">[10:15:08]</tspan><tspan x="124" class="tx">The SSO login is still</tspan></text>
    <text x="124" y="306" class="tx">blocked, we're waiting</text>
    <text x="124" y="328" class="tx">on their IT for the</text>
    <text x="124" y="350" class="tx">certificate.</text>
  </g>

  <line x1="420" y1="68" x2="420" y2="440" stroke="#21262d"/>

  <text x="448" y="82" class="sans label">CLAUDE · TASKS</text>

  <!-- new task -->
  <rect x="448" y="98" width="484" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="448" y="98" width="4" height="150" rx="2" fill="#a371f7"/>
  <g class="sans">
    <rect x="468" y="116" width="20" height="20" rx="5" fill="#a371f7"/>
    <text x="478" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#0d1117">+</text>
    <text x="498" y="132" class="h">New task · Sprint 42</text>
    <text x="468" y="166" class="b">Fix CSV encoding in billing export</text>
    <text x="468" y="190" class="m">Owner: Maria  ·  Due: Thu  ·  “before the Thursday release”  10:14</text>
    <rect x="468" y="206" width="148" height="28" rx="6" fill="#238636"/>
    <text x="542" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Created · link</text>
  </g>

  <!-- comment -->
  <rect x="448" y="266" width="484" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="448" y="266" width="4" height="150" rx="2" fill="#58a6ff"/>
  <g class="sans">
    <rect x="468" y="284" width="20" height="20" rx="5" fill="#58a6ff"/>
    <path d="M473 290 h10 v6 h-6 l-3 3 v-3 h-1 z" fill="#0d1117"/>
    <text x="498" y="300" class="h">Comment · SSO login for Acme (#318)</text>
    <text x="468" y="334" class="b">Still blocked: waiting for Acme IT to issue the</text>
    <text x="468" y="356" class="b">certificate. No new date yet.</text>
    <text x="468" y="388" class="m">Reply “ok” to post  ·  matched an open task, no duplicate</text>
  </g>

  <line x1="0" y1="452" x2="960" y2="452" stroke="#21262d"/>
  <text x="28" y="481" class="sans" font-size="13" fill="#8b949e">Action items become tasks in ClickUp, Linear, Jira, GitHub or Asana  ·  updates become comments  ·  you confirm with one word</text>
</svg>
